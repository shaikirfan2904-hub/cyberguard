{% extends "base.html" %}

{% block title %}Admin Login — CyberGuard AI{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block body %}

<div class="auth-page">

    <div class="grid-bg"></div>
    <div class="glow-orb glow-orb--1"></div>

    <div class="auth-container auth-container--center">

        <div class="auth-form-wrap auth-form-wrap--admin">

            <!-- Admin badge -->
            <div class="admin-badge">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="M12 2L4 6v6c0 5.55 3.84 10.74 8 12
                             4.16-1.26 8-6.45 8-12V6l-8-4z"/>

                    <path d="M9 12l2 2 4-4"/>

                </svg>

                <span>
                    Administrator Access
                </span>

            </div>


            <h2 class="auth-form-title">
                Admin Sign In
            </h2>

            <p class="auth-form-subtitle">
                Authorized personnel only
            </p>


            <form
                id="adminLoginForm"
                class="auth-form"
            >

                <!-- Username -->
                <div class="form-field">

                    <label for="username">
                        Admin Username
                    </label>

                    <div class="input-wrap">

                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             class="input-icon">

                            <path d="M20 21v-2a4 4 0 00-4-4H8
                                     a4 4 0 00-4 4v2"/>

                            <circle cx="12"
                                    cy="7"
                                    r="4"/>

                        </svg>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Admin username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="form-field">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrap">

                        <svg viewBox="0 0 24 24"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             class="input-icon">

                            <rect x="3"
                                  y="11"
                                  width="18"
                                  height="11"
                                  rx="2"/>

                            <path d="M7 11V7a5 5 0 0110 0v4"/>

                        </svg>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Admin password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="Show password"
                        >

                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path d="M1 12s4-8 11-8
                                         11 8 11 8-4 8-11 8
                                         -11-8-11-8z"/>

                                <circle cx="12"
                                        cy="12"
                                        r="3"/>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- Error -->
                <div
                    class="form-error"
                    id="formError"
                    role="alert"
                ></div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="btn btn--primary btn--block"
                    id="submitBtn"
                >

                    <span class="btn-text">
                        Sign In to Admin Panel
                    </span>

                    <span
                        class="btn-spinner"
                        aria-hidden="true"
                    ></span>

                </button>

            </form>


            <p class="auth-footer">

                <a href="{{ url_for('index') }}">
                    Back to home
                </a>

            </p>

        </div>

    </div>
</div>

{% endblock %}


{% block scripts %}

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

<script>
    Auth.initAdminLogin();
</script>

{% endblock %}
