<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="CyberGuard AI - Real-time communication with intelligent protection."
    >

    <title>
        {% block title %}
        CyberGuard AI
        {% endblock %}
    </title>

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <!-- Global CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css', v='20260926-2') }}"
    >

    <!-- Page-specific CSS -->
    {% block styles %}
    {% endblock %}

    <!-- Responsive CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css', v='20260926-3') }}"
    >

</head>

<body>

    {% block body %}
    {% endblock %}

    {% block scripts %}
    {% endblock %}

</body>

</html>
